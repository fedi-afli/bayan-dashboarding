<div class="mx-auto flex w-full max-w-4xl flex-col gap-8">
  <ol class="flex items-center justify-center gap-3 text-sm">
    <ng-container *ngFor="let s of ['Upload', 'Check columns', 'Dashboard']; let i = index; let last = last">
      <li class="flex items-center gap-2">
        <span
          class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold"
          [ngClass]="i + 1 < step ? 'bg-emerald-500 text-white' : i + 1 === step ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500'"
        >
          {{ i + 1 < step ? '✓' : i + 1 }}
        </span>
        <span [ngClass]="i + 1 === step ? 'font-medium text-slate-900' : 'text-slate-400'">{{ s }}</span>
      </li>
      <li *ngIf="!last" class="h-px w-10 bg-slate-200"></li>
    </ng-container>
  </ol>

  <app-fileupload *ngIf="!review" (uploaded)="onUploaded($event)"></app-fileupload>

  <app-mappingview
    *ngIf="review"
    [review]="review"
    (confirmed)="onConfirmed($event)"
    (cancelled)="startOver()"
  ></app-mappingview>
</div>
