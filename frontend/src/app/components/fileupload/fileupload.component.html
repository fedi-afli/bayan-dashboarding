<div class="flex max-w-lg flex-col gap-3">
  <div
    class="cursor-pointer rounded-xl border-2 border-dashed px-4 py-10 text-center transition-colors"
    [ngClass]="
      selectedFile
        ? 'border-indigo-500 bg-indigo-50'
        : 'border-slate-300 hover:border-slate-400 hover:bg-slate-50'
    "
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
  >
    <input
      type="file"
      id="fileInput"
      class="hidden"
      (change)="onFileSelected($event)"
      accept=".csv,.xlsx,.xls"
    />

    <label for="fileInput" class="flex cursor-pointer flex-col gap-1">
      <ng-container *ngIf="!selectedFile">
        <span class="text-sm font-semibold text-slate-800">
          Drop a file here or click to browse
        </span>
        <span class="text-xs text-slate-500">CSV or Excel files</span>
      </ng-container>

      <ng-container *ngIf="selectedFile">
        <span class="text-sm font-semibold text-slate-800">{{ selectedFile.name }}</span>
        <span class="text-xs text-slate-500">{{ (selectedFile.size / 1024).toFixed(1) }} KB</span>
      </ng-container>
    </label>
  </div>

  <p class="text-sm text-rose-600" *ngIf="errorMessage">{{ errorMessage }}</p>

  <button
    type="button"
    class="self-start rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-indigo-300"
    [disabled]="!selectedFile || isUploading"
    (click)="upload()"
  >
    {{ isUploading ? 'Uploading…' : 'Upload & analyze' }}
  </button>
</div>
