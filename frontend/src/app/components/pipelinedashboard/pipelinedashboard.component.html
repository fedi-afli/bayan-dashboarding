<div class="flex flex-col gap-5">
  <p class="text-sm text-slate-500" *ngIf="!charts?.length">
    No charts were resolved for this dataset.
  </p>

  <div
    class="rounded-xl border border-slate-200 p-4"
    *ngFor="let panel of panels; trackBy: trackByChartName"
  >
    <div class="mb-3 flex items-center justify-between">
      <h4 class="text-sm font-semibold text-slate-900">
        {{ panel.spec.title || panel.spec.name }}
      </h4>
      <button
        type="button"
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-50"
        (click)="toggleTable(panel)"
      >
        {{ panel.showTable ? 'Show chart' : 'Show raw data' }}
      </button>
    </div>

    <p class="text-sm text-slate-500" *ngIf="panel.isLoading">Loading…</p>
    <p class="text-sm text-rose-600" *ngIf="panel.error">{{ panel.error }}</p>

    <ng-container *ngIf="!panel.isLoading && !panel.error">
      <!-- lightweight bar chart, no external chart lib required -->
      <div
        class="flex flex-col gap-2"
        *ngIf="!panel.showTable && panel.labelKey && panel.valueKey"
      >
        <div
          class="grid grid-cols-[120px_1fr_60px] items-center gap-2.5 text-sm"
          *ngFor="let row of panel.rows"
        >
          <span class="truncate text-slate-700">{{ row[panel.labelKey] }}</span>
          <div class="h-3.5 overflow-hidden rounded bg-slate-100">
            <div
              class="h-full rounded bg-indigo-600"
              [style.width]="barWidth(panel, row)"
            ></div>
          </div>
          <span class="text-right tabular-nums text-slate-700">{{ row[panel.valueKey] }}</span>
        </div>
      </div>

      <table class="w-full border-collapse text-sm" *ngIf="panel.showTable && panel.rows.length">
        <thead>
        <tr>
          <th
            class="border-b border-slate-100 px-2 py-1.5 text-left font-medium text-slate-500"
            *ngFor="let key of panel.rows[0] | keyvalue"
          >
            {{ key.key }}
          </th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let row of panel.rows">
          <td
            class="border-b border-slate-100 px-2 py-1.5 text-slate-700"
            *ngFor="let cell of row | keyvalue"
          >
            {{ cell.value }}
          </td>
        </tr>
        </tbody>
      </table>

      <p class="text-sm text-slate-500" *ngIf="!panel.rows.length">
        No rows returned for this chart.
      </p>
    </ng-container>
  </div>
</div>
