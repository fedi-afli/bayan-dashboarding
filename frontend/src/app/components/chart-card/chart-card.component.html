<article class="group flex h-full flex-col rounded-2xl border border-slate-200/80 bg-white shadow-sm">
  <header class="flex items-start justify-between gap-3 px-5 pt-4">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold text-slate-800">{{ spec.title }}</h3>
      <p class="mt-0.5 h-4 truncate text-xs text-slate-400">{{ subtitle }}</p>
    </div>

    <div class="flex shrink-0 items-center gap-0.5 opacity-60 transition-opacity group-hover:opacity-100">
      <button
        type="button"
        class="rounded-md p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        [class.bg-slate-100]="showTable"
        [class.text-slate-700]="showTable"
        [title]="showTable ? 'Show chart' : 'Show numbers'"
        (click)="toggleTable()"
        *ngIf="spec.chart_type !== 'scatter'"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="4" width="14" height="12" rx="1.5" />
          <path d="M3 8h14M3 12h14M8 8v8" />
        </svg>
      </button>
      <button
        type="button"
        class="rounded-md p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        title="Hide this chart"
        (click)="hide.emit()"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 3l14 14M8.6 8.6a2 2 0 002.8 2.8M6.2 6.3C4.4 7.4 3 9 2.5 10c1.2 2.5 4.2 5 7.5 5 1.3 0 2.5-.4 3.6-1M10 5c3.3 0 6.3 2.5 7.5 5-.4.8-1 1.6-1.7 2.3" />
        </svg>
      </button>
    </div>
  </header>

  <div class="relative flex-1 px-3 pb-3 pt-2">
    <!-- chart canvas stays in the DOM so ECharts keeps its instance -->
    <div #chartEl class="w-full" [style.height.px]="height" [class.hidden]="showTable || isEmpty || !!error"></div>

    <div *ngIf="isLoading" class="absolute inset-3 animate-pulse rounded-xl bg-slate-50"></div>

    <p *ngIf="!isLoading && error" class="flex h-40 items-center justify-center px-6 text-center text-sm text-rose-500">
      {{ error }}
    </p>

    <p *ngIf="!isLoading && !error && isEmpty" class="flex h-40 items-center justify-center text-sm text-slate-400">
      No data for this period
    </p>

    <div *ngIf="showTable && !isEmpty" class="max-h-80 overflow-auto px-2">
      <table class="w-full text-sm">
        <tbody>
          <tr *ngFor="let row of data?.rows" class="border-b border-slate-100 last:border-0">
            <td class="py-1.5 pr-4 text-slate-600" [class.italic]="row.is_other">{{ row.label }}</td>
            <td class="py-1.5 text-right tabular-nums font-medium text-slate-800">{{ fmt(row.value) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</article>
