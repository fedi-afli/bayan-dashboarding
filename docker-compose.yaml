services:
  bayan_db:
    image: postgres:15
    container_name: bayan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bayan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayan_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bayan}
    ports:
      - "5432:5432"
    volumes:
      - bayan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bayan_user} -d ${POSTGRES_DB:-bayan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Identity provider (login, sign-up, sessions). Dev mode: realm imported from
  # auth/realm-bayan.dev.json on first start; data kept in the bayan_auth_data volume.
  bayan_auth:
    image: quay.io/keycloak/keycloak:26.3
    container_name: bayan_auth
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - bayan_auth_data:/opt/keycloak/data
      - ./auth/realm-bayan.dev.json:/opt/keycloak/data/import/realm-bayan.json:ro

volumes:
  bayan_db_data:
  bayan_auth_data:
